<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPERCA | CBP Rupiah 2026</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #1f2937;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 32px;
      color: #166534;
      margin-bottom: 8px;
    }

    .logo p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 13px;
      background: #166534;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #14532d;
    }

    .error {
      color: #dc2626;
      font-size: 14px;
      margin-bottom: 15px;
      display: none;
    }

    .dashboard {
      display: none;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #166534;
      color: white;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      padding: 25px 15px;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 5px;
    }

    .sidebar .subtitle {
      text-align: center;
      font-size: 11px;
      opacity: .8;
      margin-bottom: 30px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu button {
      background: transparent;
      text-align: left;
      padding: 12px;
      font-weight: normal;
    }

    .menu button:hover {
      background: rgba(255,255,255,.12);
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 15px;
      background: #dc2626 !important;
    }

    .content {
      margin-left: 250px;
      padding: 30px;
    }

    .topbar {
      background: white;
      border-radius: 15px;
      padding: 20px 25px;
      margin-bottom: 25px;
    }

    .topbar h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .topbar p {
      color: #6b7280;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    .card h3 {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .card .number {
      font-size: 30px;
      font-weight: bold;
      color: #166534;
    }

    @media (max-width: 800px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }

      .logout {
        position: static;
        margin-top: 15px;
      }

      .content {
        margin-left: 0;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section class="login-page" id="loginPage">
    <div class="login-card">

      <div class="logo">
        <h1>SIPERCA</h1>
        <p>
          Sistem Penilaian Lomba Penyiaran Edukatif
          CBP Rupiah 2026
        </p>
      </div>

      <div class="error" id="loginError"></div>

      <label>Email</label>
      <input type="email" id="email" placeholder="Masukkan email">

      <label>Password</label>
      <input type="password" id="password" placeholder="Masukkan password">

      <button onclick="login()">Masuk ke SIPERCA</button>

    </div>
  </section>


  <!-- DASHBOARD -->
  <section class="dashboard" id="dashboard">

    <aside class="sidebar">

      <h2>SIPERCA</h2>
      <div class="subtitle">CBP Rupiah 2026</div>

      <div class="menu">
        <button>Dashboard</button>
        <button>Data Rombel</button>
        <button>Data Karya</button>
        <button>Verifikasi</button>
        <button>Data Juri</button>
        <button>Penugasan Juri</button>
        <button>Penilaian</button>
        <button>Rekap Nilai</button>
        <button>Ranking</button>
        <button>Penghargaan</button>
      </div>

      <button class="logout" onclick="logout()">Keluar</button>

    </aside>

    <main class="content">

      <div class="topbar">
        <h1>Dashboard SIPERCA</h1>
        <p>Sistem Penilaian Lomba Penyiaran Edukatif CBP Rupiah 2026</p>
      </div>

      <div class="cards">

        <div class="card">
          <h3>Total Rombel</h3>
          <div class="number" id="totalRombel">0</div>
        </div>

        <div class="card">
          <h3>Total Karya</h3>
          <div class="number" id="totalKarya">0</div>
        </div>

        <div class="card">
          <h3>Total Juri</h3>
          <div class="number" id="totalJuri">0</div>
        </div>

        <div class="card">
          <h3>Karya Dinilai</h3>
          <div class="number">0</div>
        </div>

      </div>

    </main>

  </section>


<script>

  // ==========================================
  // KONEKSI SUPABASE
  // ==========================================

  const SUPABASE_URL = "https://vlqegcunqgxtdqnuhksl.supabase.co/rest/v1/";
  const SUPABASE_KEY = "sb_publishable_6ELVj9Gm85Onjx0ywOI27g_1H831FGg";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // LOGIN
  // ==========================================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const errorBox =
      document.getElementById("loginError");

    errorBox.style.display = "none";

    if (!email || !password) {
      errorBox.textContent =
        "Email dan password wajib diisi.";
      errorBox.style.display = "block";
      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      errorBox.textContent =
        "Login gagal: " + error.message;
      errorBox.style.display = "block";
      return;
    }

    tampilkanDashboard();

  }


  // ==========================================
  // TAMPILKAN DASHBOARD
  // ==========================================

  async function tampilkanDashboard() {

    document.getElementById("loginPage").style.display =
      "none";

    document.getElementById("dashboard").style.display =
      "block";

    await loadDashboard();

  }


  // ==========================================
  // DATA DASHBOARD
  // ==========================================

  async function loadDashboard() {

    const { count: rombelCount } =
      await supabaseClient
        .from("rombel")
        .select("*", { count: "exact", head: true });

    const { count: karyaCount } =
      await supabaseClient
        .from("karya")
        .select("*", { count: "exact", head: true });

    const { count: juriCount } =
      await supabaseClient
        .from("juri")
        .select("*", { count: "exact", head: true });

    document.getElementById("totalRombel").textContent =
      rombelCount || 0;

    document.getElementById("totalKarya").textContent =
      karyaCount || 0;

    document.getElementById("totalJuri").textContent =
      juriCount || 0;

  }


  // ==========================================
  // LOGOUT
  // ==========================================

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("dashboard").style.display =
      "none";

    document.getElementById("loginPage").style.display =
      "flex";

  }


  // ==========================================
  // CEK LOGIN SAAT HALAMAN DIBUKA
  // ==========================================

  async function cekSession() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session) {
      tampilkanDashboard();
    }

  }

</script>

</body>
</html>
